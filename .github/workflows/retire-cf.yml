name: Retire Cloudflare

on:
  workflow_dispatch:

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: List workers, delete 'www', confirm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: '5fb799ad908dac71a424e363119d6953'
        run: |
          echo "Workers on the account:"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts" \
            | tee /tmp/list.json
          echo ""
          echo "Deleting worker 'www'..."
          curl -sS -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/www" \
            | tee /tmp/del.json
          echo ""
          grep -q '"success":true' /tmp/del.json \
            && echo "Worker 'www' deleted." \
            || { echo "::error::Delete failed"; exit 1; }
