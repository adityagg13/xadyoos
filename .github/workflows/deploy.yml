name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # A Cloudflare account id is a public identifier, not a credential.
  CF_ACCOUNT_ID: 5fb799ad908dac71a424e363119d6953

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (assets + Worker)
        run: bun run build

      - name: Resolve Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          ACCOUNT="${RAW_ACCOUNT//[[:space:]]/}"
          [ -z "$ACCOUNT" ] && ACCOUNT="$CF_ACCOUNT_ID"

          # The secret may hold only the token, or the token plus the account id
          # on separate lines (either order). API tokens never contain spaces,
          # so strip every whitespace character including pasted line breaks.
          TOKEN="${RAW_TOKEN//[[:space:]]/}"
          TOKEN="${TOKEN//$CF_ACCOUNT_ID/}"

          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare API token found. Add a CLOUDFLARE_API_TOKEN secret (permission: Workers Scripts -> Edit) under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "Parsed an API token of ${#TOKEN} characters"

          STATUS=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)

          if [ "$STATUS" != "200" ]; then
            echo "::error::Cloudflare rejected the API token (HTTP $STATUS)."
            head -c 500 /tmp/verify.json || true
            exit 1
          fi
          echo "Cloudflare accepted the API token"

          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
          } >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
