name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # A Cloudflare account id is a public identifier, not a credential.
  CF_ACCOUNT_ID: 5fb799ad908dac71a424e363119d6953

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (assets + Worker)
        run: bun run build

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN repository secret (Cloudflare dashboard -> My Profile -> API Tokens, permission: Workers Scripts -> Edit)."
            exit 1
          fi

          echo "::add-mask::$CF_TOKEN"

          STATUS=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)

          if [ "$STATUS" != "200" ]; then
            echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN (HTTP $STATUS). Create a fresh token and paste only its value, with no account id, labels or line breaks."
            head -c 500 /tmp/verify.json || true
            exit 1
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CF_ACCOUNT_ID }}
        run: bunx wrangler deploy
