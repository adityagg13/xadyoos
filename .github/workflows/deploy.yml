name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (assets + Worker)
        run: bun run build

      - name: Resolve Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          TOKEN=""
          ACCOUNT="${RAW_ACCOUNT//[[:space:]]/}"

          # A single secret may hold both values on separate lines: the API token
          # and the 32 hex character account id. Split them, whichever way round.
          while IFS= read -r line; do
            line="${line//[[:space:]]/}"
            [ -z "$line" ] && continue
            if [ -z "$ACCOUNT" ] && [[ "$line" =~ ^[0-9a-f]{32}$ ]]; then
              ACCOUNT="$line"
            elif [ -z "$TOKEN" ]; then
              TOKEN="$line"
            fi
          done <<< "${RAW_TOKEN}"

          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare API token found. Add a CLOUDFLARE_API_TOKEN secret (Workers Scripts: Edit) in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          if [ -z "$ACCOUNT" ]; then
            ACCOUNT=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              https://api.cloudflare.com/client/v4/accounts \
              | jq -r '.result[0].id // empty')
          fi

          if [ -z "$ACCOUNT" ]; then
            echo "::error::Could not resolve a Cloudflare account id. Put the token and the account id in the CLOUDFLARE secret (two lines), or add a CLOUDFLARE_ACCOUNT_ID secret."
            exit 1
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "Using Cloudflare account $ACCOUNT"

      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
