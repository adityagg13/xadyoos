name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # A Cloudflare account id is a public identifier, not a credential.
  CF_ACCOUNT_ID: 5fb799ad908dac71a424e363119d6953

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (assets + Worker)
        run: bun run build

      - name: Resolve Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | sed -E 's/[^0-9a-f]//g')
          [ -z "$ACCOUNT" ] && ACCOUNT="$CF_ACCOUNT_ID"

          # A Cloudflare API token only uses letters, digits, underscore and
          # hyphen. Secrets often arrive with line breaks, labels or stray
          # symbols wrapped around the real value, so probe the plausible
          # token shapes and keep the one Cloudflare accepts.
          CLEANED=$(printf '%s' "$RAW_TOKEN" | tr -cd 'A-Za-z0-9_-')

          verify_token() {
            [ -z "$1" ] && return 1
            local code
            code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
              -H "Authorization: Bearer $1" \
              https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)
            [ "$code" = "200" ]
          }

          candidates=("$CLEANED")
          if [[ "$CLEANED" == *cfk_* ]]; then
            candidates+=("cfk_${CLEANED#*cfk_}")
          fi
          for n in 40 44 48 49 52 56 60 64 68 72; do
            [ ${#CLEANED} -ge "$n" ] && candidates+=("${CLEANED:0:$n}" "${CLEANED: -$n}")
          done

          TOKEN=""
          for candidate in "${candidates[@]}"; do
            if verify_token "$candidate"; then
              TOKEN="$candidate"
              break
            fi
          done

          if [ -z "$TOKEN" ]; then
            code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLEANED" \
              https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)
            echo "::error::No usable Cloudflare API token in the secret (${#CLEANED} characters, verify HTTP $code)."
            head -c 500 /tmp/verify.json || true
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "Cloudflare accepted a token of ${#TOKEN} characters"

          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
          } >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
