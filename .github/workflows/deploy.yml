name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # A Cloudflare account id is a public identifier, not a credential.
  CF_ACCOUNT_ID: 5fb799ad908dac71a424e363119d6953

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (assets + Worker)
        run: bun run build

      - name: Resolve Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          TOKEN=""
          ACCOUNT="${RAW_ACCOUNT//[[:space:]]/}"
          [ -z "$ACCOUNT" ] && ACCOUNT="$CF_ACCOUNT_ID"

          # A single secret may hold the token and the account id on separate
          # lines, in any order. Keep the 32 hex character line as the account.
          while IFS= read -r line; do
            line="${line//[[:space:]]/}"
            [ -z "$line" ] && continue
            if [[ "$line" =~ ^[0-9a-f]{32}$ ]]; then
              ACCOUNT="$line"
            elif [ -z "$TOKEN" ]; then
              TOKEN="$line"
            fi
          done <<< "${RAW_TOKEN}"

          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare API token found. Add a CLOUDFLARE_API_TOKEN secret (permission: Workers Scripts -> Edit) under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
          } >> "$GITHUB_ENV"

          echo "Using Cloudflare account $ACCOUNT"

      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
