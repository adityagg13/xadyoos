name: Delete old worker

on:
  push:
    branches:
      - main

concurrency:
  group: delete-old-worker
  cancel-in-progress: true

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete the old saas-landing worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '5fb799ad908dac71a424e363119d6953' }}
        run: |
          CODE=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/saas-landing")
          echo "HTTP $CODE"
          head -c 400 /tmp/del.json || true
          if [ "$CODE" = "200" ]; then
            echo "Old worker deleted."
          elif [ "$CODE" = "404" ]; then
            echo "Old worker already gone."
          else
            echo "::warning::Unexpected response (HTTP $CODE) — token may lack Workers Scripts Edit permission."
          fi
